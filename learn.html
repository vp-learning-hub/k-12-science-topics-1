<!DOCTYPE html>
<html lang="en" data-theme="scifi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learning - ScienceQuest</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/cards.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/themes/scifi.css" />
</head>
<body class="learn-page">

  <div class="bg-particles" aria-hidden="true">
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div>
  </div>

  <!-- Header -->
  <header class="learn-header">
    <div class="header-inner">
      <a href="index.html" class="btn btn--ghost btn--sm back-btn" aria-label="Back to home">
        ← Back
      </a>
      <div class="learn-topic-info">
        <span class="topic-breadcrumb" id="topicBreadcrumb">Science → Matter</span>
      </div>
      <div class="header-actions">
        <button class="btn btn--ghost btn--sm" id="settingsBtn" aria-label="Settings">⚙️</button>
      </div>
    </div>
  </header>

  <!-- Session progress bar -->
  <div class="session-progress" role="progressbar" aria-label="Session progress">
    <div class="session-progress__track">
      <div class="session-progress__fill" id="sessionProgressFill" style="width:0%"></div>
    </div>
    <span class="session-progress__label" id="sessionProgressLabel">0 / 20 cards</span>
  </div>

  <!-- Gamification bar -->
  <div class="gamification-bar">
    <div class="gam-item streak-display">
      <span class="gam-icon">🔥</span>
      <span class="gam-value" id="streakCount">0</span>
      <span class="gam-label">Streak</span>
    </div>
    <div class="gam-item score-display">
      <span class="gam-icon">⭐</span>
      <span class="gam-value" id="scoreCount">0</span>
      <span class="gam-label">Score</span>
    </div>
    <div class="gam-item">
      <span class="gam-icon" id="subtopicIcon">⚗️</span>
      <span class="gam-value" id="subtopicName">Matter</span>
    </div>
  </div>

  <!-- Main card area -->
  <main class="card-stage" id="cardStage" role="main">
    <!-- Cards are rendered here by JavaScript -->
    <div class="card-loading" id="cardLoading">
      <div class="loading-spinner"></div>
      <p>Loading your mission...</p>
    </div>
  </main>

  <!-- Achievement popup -->
  <div class="achievement-popup" id="achievementPopup" role="alert" aria-live="assertive" hidden>
    <div class="achievement-popup__inner">
      <div class="achievement-popup__icon" id="achIcon">🏆</div>
      <div class="achievement-popup__text">
        <div class="achievement-popup__name" id="achName">Achievement Unlocked!</div>
        <div class="achievement-popup__desc" id="achDesc">First Steps!</div>
      </div>
    </div>
  </div>

  <!-- Settings panel -->
  <div class="settings-panel" id="settingsPanel" hidden role="dialog" aria-label="Settings">
    <div class="settings-panel__overlay" id="settingsOverlay"></div>
    <div class="settings-panel__content">
      <div class="settings-panel__header">
        <h2>Settings</h2>
        <button class="btn btn--ghost btn--sm" id="closeSettings" aria-label="Close settings">✕</button>
      </div>
      <div class="settings-panel__body">
        <label class="setting-toggle">
          <span>Sound Effects</span>
          <input type="checkbox" id="soundToggle" role="switch" />
          <span class="toggle-track"></span>
        </label>
        <label class="setting-toggle">
          <span>Animations</span>
          <input type="checkbox" id="animToggle" role="switch" checked />
          <span class="toggle-track"></span>
        </label>
        <button class="btn btn--danger btn--sm" id="resetProgress">Reset Progress</button>
      </div>
    </div>
  </div>

  <!-- Session complete screen -->
  <div class="session-complete" id="sessionComplete" hidden>
    <div class="session-complete__inner">
      <div class="session-complete__fireworks" aria-hidden="true"></div>
      <h1 class="session-complete__title">Mission Complete!</h1>
      <div class="session-complete__stats">
        <div class="complete-stat">
          <span class="complete-stat__val" id="finalScore">0</span>
          <span class="complete-stat__label">Total Score</span>
        </div>
        <div class="complete-stat">
          <span class="complete-stat__val" id="finalCorrect">0/0</span>
          <span class="complete-stat__label">Correct</span>
        </div>
        <div class="complete-stat">
          <span class="complete-stat__val" id="finalStreak">0</span>
          <span class="complete-stat__label">Best Streak</span>
        </div>
      </div>
      <div class="complete-badges" id="completeBadges"></div>
      <div class="complete-actions">
        <a href="index.html" class="btn btn--primary">Back to Missions</a>
        <a href="progress.html" class="btn btn--secondary">View Progress</a>
        <button class="btn btn--ghost" id="replayBtn">Play Again</button>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/facts.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
