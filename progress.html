<!DOCTYPE html>
<html lang="en" data-theme="scifi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Progress - ScienceQuest</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/themes/scifi.css" />
</head>
<body class="progress-page">

  <div class="bg-particles" aria-hidden="true">
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
  </div>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="btn btn--ghost btn--sm back-btn">← Back</a>
      <div class="logo">
        <span class="logo-icon">⚛️</span>
        <span class="logo-text">Science<strong>Quest</strong></span>
      </div>
      <div style="width:80px"></div>
    </div>
  </header>

  <main class="progress-main">
    <h1 class="page-title">Mission Control</h1>
    <p class="page-subtitle">Track your science journey</p>

    <!-- Overview cards -->
    <section class="overview-grid">
      <div class="overview-card">
        <div class="overview-card__icon">⭐</div>
        <div class="overview-card__value" id="ovTotalScore">0</div>
        <div class="overview-card__label">Total Score</div>
      </div>
      <div class="overview-card">
        <div class="overview-card__icon">🃏</div>
        <div class="overview-card__value" id="ovCardsCompleted">0</div>
        <div class="overview-card__label">Cards Done</div>
      </div>
      <div class="overview-card">
        <div class="overview-card__icon">🎯</div>
        <div class="overview-card__value" id="ovAccuracy">—</div>
        <div class="overview-card__label">Accuracy</div>
      </div>
      <div class="overview-card">
        <div class="overview-card__icon">🔥</div>
        <div class="overview-card__value" id="ovBestStreak">0</div>
        <div class="overview-card__label">Best Streak</div>
      </div>
    </section>

    <!-- Topic progress -->
    <section class="topic-progress-section">
      <h2 class="section-title">Topic Progress</h2>
      <div class="topic-progress-list" id="topicProgressList">
        <!-- Rendered by JS -->
      </div>
    </section>

    <!-- Badges -->
    <section class="badges-section">
      <h2 class="section-title">Badges Earned</h2>
      <div class="badges-grid" id="badgesGrid">
        <p class="empty-msg" id="noBadgesMsg">No badges yet. Start learning to earn them!</p>
      </div>
    </section>

    <!-- Danger zone -->
    <section class="danger-section">
      <h2 class="section-title">Reset</h2>
      <p>This will erase all your progress. It cannot be undone.</p>
      <button class="btn btn--danger" id="resetAllProgress">Reset All Progress</button>
    </section>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/app-progress.js"></script>
</body>
</html>
